services:
  postgres:
    image: postgres:17-alpine
    container_name: taskpace-postgres
    restart: unless-stopped

    environment: 
      POSTGRES_USER: taskpace
      POSTGRES_PASSWORD: taskpace_dev
      POSTGRES_DB: taskpace 

    ports:
      - "5433:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: