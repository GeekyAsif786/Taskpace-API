[project]
name = "workspace-api"
version = "0.1.0"
description = "A multi-tenant SaaS backend built with FastAPI"
readme = "README.md"
requires-python = ">=3.11,<3.15"

dependencies = [
    "fastapi[standard]",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",

    "sqlalchemy[asyncio]>=2.1,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.20,<2.0",

    "pyjwt>=2.0,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",

    "redis>=6.0,<7.0",
    "celery[redis]>=5.6,<5.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=1.0,<2.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.13,<1.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]